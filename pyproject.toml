[project]
name = "pybites-pysource"
version = "1.2.0"
description = "Read Python source code from the command line"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bob Belderbos", email = "bob@belderbos.dev" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/PyBites-Open-Source/pysource"

[project.scripts]
pysource = "pysource.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysource"]

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pyrefly>=1.0.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
